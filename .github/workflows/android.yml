name: App Android (APK)

on:
  push:
    branches: [main, android-app]
    paths: ["android-app/**", "simple/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar Capacitor
        run: npm ci
      - name: Copiar la app web adentro del proyecto Android
        run: npm run sync
      - name: Compilar el APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../salida
          cp app/build/outputs/apk/debug/app-debug.apk ../salida/ronda-gervital.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ronda-gervital-apk
          path: android-app/salida/ronda-gervital.apk
      - name: Publicar para descargar desde el celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest salida/ronda-gervital.apk \
            --target "$GITHUB_SHA" \
            --title "Ronda para Android (versión de prueba ${GITHUB_RUN_NUMBER})" \
            --notes "Descargá ronda-gervital.apk desde el celular Android e instalala. Solo para pruebas con datos de ejemplo."
